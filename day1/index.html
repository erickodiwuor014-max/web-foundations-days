<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
  </head>
  <body>

    <header>
      <h1>QuickNotes</h1>
      <p>Your fast, simple note-taking app.</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main>
      <h2>My Notes</h2>

      <section>
        <h3>Add a Note</h3>
        <form>
          <label for="note-title">Title</label>
          <input type="text" id="note-title" name="note-title" placeholder="Note title" />

          <label for="note-body">Note</label>
          <textarea id="note-body" name="note-body" placeholder="Write your note here..."></textarea>

          <button type="submit">Save Note</button>
        </form>
      </section>

      <section>
        <h3>Saved Notes</h3>
        <p>No notes yet. Add one above to get started.</p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>

  </body>
</html>
